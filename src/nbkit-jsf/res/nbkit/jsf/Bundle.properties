# nbkit JSF: texts shown in NetBeans (English, default)
OpenIDE-Module-Name=nbkit JSF
OpenIDE-Module-Short-Description=xhtml checks (JSF, Facelets, PrimeFaces)
hint=\ Did you mean '%s'?
hint.at=\ Did you mean '%s' (%s)?
hint.bean=bean %s
unused.lambda=Lambda parameter '%s' is not used.
el.scope='%s' %s.
el.scope.after=only exists after the %s on line %s
el.scope.inside=only exists inside the %s on line %s
el.unknown='%s' does not exist.
el.unknown.resolver='%s' does not exist here, unless the EL resolver %s provides it.
el.bundle.included='%s' comes from the f:loadBundle in %s, a file this page includes: it works, but depends on it. Declare the f:loadBundle in this page.
jstl.iteration=%s runs before the page is built: '%s' (from %s) is still null here. Use rendered instead.
el.kind.method=%s expects a method, but '%s' is a property (get%s) in %s.
el.kind.property='%s' is a method in %s, not a property. Use %s() or create get%s().
el.member.method=Method '%s' does not exist in %s.
el.member.property=Property '%s' does not exist in %s.
el.enum='%s' is not a constant of %s (%s).
el.readonly.literal=The value of %s must point to a property (#{bean.field}) to be written.
el.readonly.expr=The value of %s cannot be written: it has a method call, arithmetic or text with it. Use only #{bean.field}.
el.readonly.some='%s' has set%s() in only some implementations of %s: when the object is a %s, the typed value has nowhere to be written.
el.readonly.setter='%s' has no set%s() in %s: the typed value has nowhere to be written.
unused.declared='%s' (%s) is declared and never used.
cc.attrs='%s' is not declared in cc:interface.
unused.ccattr=cc:attribute '%s' is declared and never used in cc:implementation.
meta.viewparam=%s outside f:metadata is ignored.
sec.escape=escape="false" with a dynamic value: if it comes from the user, it opens an XSS hole.
el.immediate=In JSF component attributes use #{...} instead of ${...}.
id.invalid=Invalid id: it must start with a letter or _ and have only letters, digits, - and _.
form.upload=p:fileUpload in simple mode needs enctype="multipart/form-data" on the h:form.
form.messages=This field has validation, but the page has no h:messages, p:messages or p:growl: if it fails, nothing shows up.
ajax.event=Event '%s' does not exist in %s.%s Available: %s.
res.missing=Resource '%s' does not exist in resources/.
nav.missing=The page '%s' does not exist.
id.duplicate.foreach=id '%s' inside c:forEach (line %s) repeats on every iteration. Use ui:repeat or remove the id.
id.duplicate=id '%s' already exists on line %s in the same container.
id.duplicate.jstl=id '%s' already exists on line %s in the same container (they are in different JSTL conditions; if both can exist together, it fails).
js.widgetvar=No component with widgetVar="%s" in this page.
id.keyword='@%s' is not a known search keyword.
id.missing=No component with id '%s' in this page.
id.missing.some=The id '%s' does not exist in every page that uses this file.
id.rendered='%s' has rendered: if it is hidden, this update does not happen. Wrap it in a p:outputPanel (or an h:panelGroup with an id) and update that.
form.dialog=The dialog has appendTo body and leaves the h:form: %s here submits nothing. Put an h:form inside the dialog.
form.outside.action=%s outside h:form does nothing when clicked.
form.outside.button=%s outside h:form: if it is only visual, use type="button" (or p:button); if it should submit something, put it in an h:form.
form.outside.input=%s outside h:form: the value is never submitted.
form.nested=h:form inside another h:form: the browser drops the inner one and the buttons stop working.
tpl.path=The file '%s' does not exist.
tpl.define.name=The template has no ui:insert name="%s": this content disappears.
tpl.define.empty=Empty ui:define and the template has no ui:insert name="%s": it does nothing, it can be removed.
tpl.define.tag=%s outside ui:define is ignored (the template has no ui:insert without a name).
tpl.define.text=Text outside ui:define is ignored (the template has no ui:insert without a name).
comment.el=EL in a comment is executed by Facelets. Use ui:remove to comment it out, or turn on FACELETS_SKIP_COMMENTS.
xml.entity.code=&%s; does not exist in XML and breaks Facelets. Use %s.
xml.entity=&%s; does not exist in XML and breaks Facelets. Use the numeric code (&#...;).
options.all=Select all
options.none=Clear all
options.intro=<html>nbkit xhtml checks (JSF, Facelets and PrimeFaces).<br>Red: certainly breaks. Yellow: probable error, or depends on something outside the file.</html>
rule.el.unknown=EL: name that does not exist (e.g. a misspelled bean)
rule.el.scope=EL: variable used outside where it exists
rule.el.member=EL: property or method that does not exist in the bean
rule.el.readonly=EL: input whose value cannot be written
rule.el.kind=EL: method where a property is expected, and the other way around
rule.el.enum=EL: comparison with an enum constant that does not exist
rule.cc.attrs=Composite component: cc.attrs not declared in cc:interface
rule.unused=Declared and never used (ui:param, c:set, var, cc:attribute...)
rule.id.missing=IDs: update/process/for pointing to an id that does not exist
rule.id.keyword=IDs: wrong PrimeFaces search keyword (@from)
rule.id.invalid=IDs: id with an invalid format
rule.id.duplicate=IDs: id repeated in the same container
rule.id.rendered=IDs: update of a component that has rendered
rule.js.widgetvar=JavaScript: PF('name') without a matching widgetVar
rule.form.outside=Form: button or input outside h:form
rule.form.nested=Form: h:form inside h:form
rule.form.dialog=Form: p:dialog with appendTo body and no form inside
rule.form.upload=Form: p:fileUpload without multipart enctype
rule.form.messages=Form: validation without a message component
rule.jstl.iteration=JSTL using the variable of a ui:repeat/p:dataTable
rule.meta.viewparam=f:viewParam/f:viewAction outside f:metadata
rule.ajax.event=p:ajax/f:ajax with an event the component does not have
rule.tpl.define=Template: ui:define without ui:insert, and ignored content
rule.tpl.path=Template: ui:include/template with a path that does not exist
rule.res.missing=Resource (css, js, image) that does not exist
rule.nav.missing=Navigation to a page that does not exist
rule.comment.el=EL inside a comment (it is executed)
rule.xml.entity=HTML entity (&nbsp;) that breaks Facelets
rule.sec.escape=escape="false" with a dynamic value (XSS)
rule.el.immediate=${...} in a JSF component attribute
rule.origin=Where a name or id comes from when it is in another file (blue note)
rule.css.class=CSS: where a class comes from, and a close name when it has no rule (blue note; replaces NetBeans' "Missing CSS Class")
