skip.css.external=a p\u00e1gina carrega uma folha de estilo que o nbkit n\u00e3o l\u00ea (href externo): uma classe n\u00e3o achada n\u00e3o \u00e9 checada
skip.css.sheet.el=nome de folha de estilo com EL: suas classes n\u00e3o s\u00e3o conhecidas
skip.res.el=nome ou biblioteca de recurso com EL
skip.ajax.el=evento de ajax com EL
skip.nav.el=action ou outcome com EL: o resultado s\u00f3 \u00e9 conhecido em tempo de execu\u00e7\u00e3o
skip.cc.dynamic=atributo lido por um nome conhecido s\u00f3 em tempo de execu\u00e7\u00e3o: atributos sem uso n\u00e3o s\u00e3o checados
