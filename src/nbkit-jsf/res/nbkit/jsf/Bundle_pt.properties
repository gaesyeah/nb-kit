# o que uma regra n\u00e3o conseguiu checar, e por qu\u00ea (nbkit analyze jsf: a lista de pulados)
skip.header=N\u00e3o checado: %d (limites de qualquer checagem est\u00e1tica: %d, lacunas que o nbkit pode fechar: %d)
skip.group.STATIC=Limites de qualquer checagem est\u00e1tica
skip.group.GAP=Lacunas que o nbkit pode fechar
skip.more=e mais %d
skip.howto=Algumas listas foram cortadas em 20. Para ver tudo de um arquivo: nbkit analyze jsf %s --explain <arquivo>
skip.file=N\u00e3o checado neste arquivo:
skip.el.dynamic=valor de Map ou Object (o resto da express\u00e3o n\u00e3o \u00e9 checado)
skip.el.index=\u00edndice conhecido s\u00f3 em tempo de execu\u00e7\u00e3o (o resto da express\u00e3o n\u00e3o \u00e9 checado)
skip.el.incomplete=classe fora do classpath (o resto da express\u00e3o n\u00e3o \u00e9 checado)
skip.el.impl=s\u00f3 numa implementa\u00e7\u00e3o, o EL acha em tempo de execu\u00e7\u00e3o (o resto da express\u00e3o n\u00e3o \u00e9 checado)
skip.el.untyped=tipo do nome desconhecido: ui:param, c:set, vari\u00e1vel de loop, objeto impl\u00edcito ou cc.attrs sem type (a express\u00e3o n\u00e3o \u00e9 checada)
skip.el.stream=o que um stream do EL devolve n\u00e3o \u00e9 seguido (o resto da express\u00e3o n\u00e3o \u00e9 checado)
skip.el.bundle=pacote de mensagens (f:loadBundle ou faces-config): suas chaves n\u00e3o s\u00e3o checadas
skip.el.nobeans=sem classes compiladas: os beans n\u00e3o s\u00e3o conhecidos
skip.var.el=nome de vari\u00e1vel com EL: o nome que ela declara s\u00f3 \u00e9 conhecido em tempo de execu\u00e7\u00e3o
skip.id.el=ids com EL, conhecidos s\u00f3 em tempo de execu\u00e7\u00e3o
skip.id.dynamic=n\u00e3o existe onde uma p\u00e1gina que inclui esta monta seus ids com EL
skip.idattr.el=id com EL: repeti\u00e7\u00f5es e formato n\u00e3o s\u00e3o checados
skip.widgetvar.dynamic=um widgetVar da p\u00e1gina \u00e9 montado com EL
skip.tpl.dynamic=src ou template com EL: o arquivo s\u00f3 \u00e9 conhecido em tempo de execu\u00e7\u00e3o
skip.css.el=classe com EL, conhecida s\u00f3 em tempo de execu\u00e7\u00e3o
