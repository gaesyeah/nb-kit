explain.impl=s\u00f3 numa implementa\u00e7\u00e3o, %s (o EL acha em tempo de execu\u00e7\u00e3o; o resto n\u00e3o \u00e9 conferido)
explain.resource=recurso do JSF (confere se o arquivo existe)
explain.none=Nenhum arquivo de %s bate com %s.
