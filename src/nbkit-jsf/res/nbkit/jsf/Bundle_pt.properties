# nbkit JSF: textos mostrados no NetBeans (portugues)
OpenIDE-Module-Name=nbkit JSF
OpenIDE-Module-Short-Description=Verifica\u00e7\u00f5es de xhtml (JSF, Facelets, PrimeFaces)
hint=\ Voc\u00ea quis dizer '%s'?
unused.lambda=Par\u00e2metro de lambda '%s' n\u00e3o \u00e9 usado.
el.scope='%s' %s.
el.scope.after=s\u00f3 existe depois do %s da linha %s
el.scope.inside=s\u00f3 existe dentro do %s da linha %s
el.unknown='%s' n\u00e3o existe.
el.unknown.maybe='%s' n\u00e3o existe aqui (se vier de quem inclui este arquivo, ignore).
jstl.iteration=%s roda antes da tela ser montada: '%s' (do %s) ainda \u00e9 null aqui. Use rendered no lugar.
el.kind.method=%s espera um m\u00e9todo, mas '%s' \u00e9 propriedade (get%s) em %s.
el.kind.property='%s' \u00e9 m\u00e9todo em %s, n\u00e3o propriedade. Use %s() ou crie get%s().
el.member.method=M\u00e9todo '%s' n\u00e3o existe em %s.
el.member.property=Propriedade '%s' n\u00e3o existe em %s.
el.enum='%s' n\u00e3o \u00e9 constante de %s (%s).
el.readonly.literal=value de %s precisa apontar para uma propriedade (#{bean.campo}) para ser gravado.
el.readonly.expr=value de %s n\u00e3o pode ser gravado: tem chamada de m\u00e9todo, conta ou texto junto. Use s\u00f3 #{bean.campo}.
el.readonly.setter='%s' n\u00e3o tem set%s() em %s: o valor digitado n\u00e3o tem onde ser gravado.
unused.declared='%s' (%s) \u00e9 declarado e n\u00e3o \u00e9 usado.
cc.attrs='%s' n\u00e3o est\u00e1 declarado no cc:interface.
unused.ccattr=cc:attribute '%s' \u00e9 declarado e n\u00e3o \u00e9 usado no cc:implementation.
meta.viewparam=%s fora de f:metadata \u00e9 ignorado.
sec.escape=escape="false" com valor din\u00e2mico: se vier do usu\u00e1rio, abre brecha de XSS.
el.immediate=Em atributo de componente JSF use #{...} no lugar de ${...}.
id.invalid=id inv\u00e1lido: precisa come\u00e7ar com letra ou _ e ter s\u00f3 letras, n\u00fameros, - e _.
form.upload=p:fileUpload modo simple precisa de enctype="multipart/form-data" no h:form.
form.messages=Este campo tem valida\u00e7\u00e3o, mas a tela n\u00e3o tem h:messages, p:messages nem p:growl: se falhar, nada aparece.
ajax.event=Evento '%s' n\u00e3o existe em %s.%s Dispon\u00edveis: %s.
res.missing=Recurso '%s' n\u00e3o existe em resources/.
nav.missing=A p\u00e1gina '%s' n\u00e3o existe.
id.duplicate.foreach=id '%s' dentro de c:forEach (linha %s) se repete a cada volta. Use ui:repeat ou tire o id.
id.duplicate=id '%s' j\u00e1 existe na linha %s no mesmo container.
id.duplicate.jstl=id '%s' j\u00e1 existe na linha %s no mesmo container (est\u00e3o em condi\u00e7\u00f5es diferentes do JSTL; se as duas puderem existir juntas, d\u00e1 erro).
js.widgetvar=Nenhum componente com widgetVar="%s" nesta tela.
id.keyword='@%s' n\u00e3o \u00e9 palavra de busca conhecida.
id.missing=Nenhum componente com id '%s' nesta tela.
id.missing.some=O id '%s' n\u00e3o existe em todas as telas que usam este arquivo.
id.rendered='%s' tem rendered: se estiver oculto, este update n\u00e3o acontece. Envolva num p:outputPanel (ou h:panelGroup com id) e atualize ele.
form.dialog=O di\u00e1logo tem appendTo body e sai do h:form: %s aqui n\u00e3o envia nada. Coloque um h:form dentro do di\u00e1logo.
form.outside.action=%s fora de h:form n\u00e3o faz nada ao clicar.
form.outside.button=%s fora de h:form: se for s\u00f3 visual, use type="button" (ou p:button); se for enviar algo, coloque num h:form.
form.outside.input=%s fora de h:form: o valor nunca \u00e9 enviado.
form.nested=h:form dentro de outro h:form: o navegador descarta o de dentro e os bot\u00f5es param de funcionar.
tpl.path=O arquivo '%s' n\u00e3o existe.
tpl.define.name=O template n\u00e3o tem ui:insert name="%s": este conte\u00fado some.
tpl.define.tag=%s fora de ui:define \u00e9 ignorado (o template n\u00e3o tem ui:insert sem nome).
tpl.define.text=Texto fora de ui:define \u00e9 ignorado (o template n\u00e3o tem ui:insert sem nome).
comment.el=EL em coment\u00e1rio \u00e9 executado pelo Facelets. Use ui:remove para comentar, ou ative FACELETS_SKIP_COMMENTS.
xml.entity.code=&%s; n\u00e3o existe em XML e quebra o Facelets. Use %s.
xml.entity=&%s; n\u00e3o existe em XML e quebra o Facelets. Use o c\u00f3digo num\u00e9rico (&#...;).
options.all=Marcar todas
options.none=Desmarcar todas
options.intro=<html>Verifica\u00e7\u00f5es de xhtml (JSF, Facelets e PrimeFaces) do nbkit.<br>Vermelho: quebra com certeza. Amarelo: prov\u00e1vel erro, ou depende de algo fora do arquivo.</html>
rule.el.unknown=EL: nome que n\u00e3o existe (#{batataDoce})
rule.el.scope=EL: vari\u00e1vel usada fora de onde ela existe
rule.el.member=EL: propriedade ou m\u00e9todo que n\u00e3o existe no bean
rule.el.readonly=EL: campo de entrada com value que n\u00e3o pode ser gravado
rule.el.kind=EL: m\u00e9todo onde se espera propriedade, e o contr\u00e1rio
rule.el.enum=EL: compara\u00e7\u00e3o com constante de enum que n\u00e3o existe
rule.cc.attrs=Componente composto: cc.attrs n\u00e3o declarado no cc:interface
rule.unused=Declarado e n\u00e3o usado (ui:param, c:set, var, cc:attribute...)
rule.id.missing=IDs: update/process/for apontando para id que n\u00e3o existe
rule.id.keyword=IDs: palavra de busca do PrimeFaces errada (@from)
rule.id.invalid=IDs: id com formato inv\u00e1lido
rule.id.duplicate=IDs: id repetido no mesmo container
rule.id.rendered=IDs: update de componente que tem rendered
rule.js.widgetvar=JavaScript: PF('nome') sem widgetVar correspondente
rule.form.outside=Formul\u00e1rio: bot\u00e3o ou campo fora de h:form
rule.form.nested=Formul\u00e1rio: h:form dentro de h:form
rule.form.dialog=Formul\u00e1rio: p:dialog com appendTo body sem form dentro
rule.form.upload=Formul\u00e1rio: p:fileUpload sem enctype multipart
rule.form.messages=Formul\u00e1rio: valida\u00e7\u00e3o sem componente de mensagem
rule.jstl.iteration=JSTL usando a vari\u00e1vel de um ui:repeat/p:dataTable
rule.meta.viewparam=f:viewParam/f:viewAction fora de f:metadata
rule.ajax.event=p:ajax/f:ajax com evento que o componente n\u00e3o tem
rule.tpl.define=Template: ui:define sem ui:insert, e conte\u00fado ignorado
rule.tpl.path=Template: ui:include/template com caminho que n\u00e3o existe
rule.res.missing=Recurso (css, js, imagem) que n\u00e3o existe
rule.nav.missing=Navega\u00e7\u00e3o para p\u00e1gina que n\u00e3o existe
rule.comment.el=EL dentro de coment\u00e1rio (\u00e9 executado)
rule.xml.entity=Entidade HTML (&nbsp;) que quebra o Facelets
rule.sec.escape=escape="false" com valor din\u00e2mico (XSS)
