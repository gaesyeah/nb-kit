    <!-- a class with no CSS rule that the project's JavaScript uses: a blue note saying where -->
    <div class="from-query from-classlist added-js">x</div><!--I:css.class-->
    <div class="second-arg">x</div><!--I:css.class-->
    <div class="inline-hook">x</div><!--I:css.class-->

    <div class="ui-widget">x</div><!--I:css.class-->

    <div class="nowhere-at-all">x</div><!--W:css.class-->
