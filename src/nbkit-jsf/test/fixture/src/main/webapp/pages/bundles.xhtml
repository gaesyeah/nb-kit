<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/main.xhtml">
  <ui:define name="content">
    <f:loadBundle var="b" basename="messages"/>
    <f:loadBundle var="lost" basename="nowhere"/>
    <!-- a fixed key of a bundle is looked up in every .properties of the bundle -->
    <h:outputText value="#{b['save']} #{b.cancel}"/><!--I:bundle.key-->
    <h:outputText value="#{b['savee']}"/><!--E:bundle.key-->
    <h:outputText value="#{b['onlyBase']}"/><!--W:bundle.key-->
    <h:outputText value="#{msg['hello']}"/><!--I:origin I:bundle.key-->
    <!-- a key known only at runtime, and a bundle that is not found, cannot be checked -->
    <h:outputText value="#{b[customerVM.title]}"/><!--S:el.dynamic-->
    <h:outputText value="#{lost['x']}"/><!--S:el.bundle-->
  </ui:define>
</ui:composition>
