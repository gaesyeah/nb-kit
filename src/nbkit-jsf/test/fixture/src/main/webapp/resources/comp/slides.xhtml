<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:cc="jakarta.faces.composite" xmlns:ui="jakarta.faces.facelets">
  <cc:interface>
    <cc:attribute name="items"/>
  </cc:interface>
  <cc:implementation>
    <!-- what the page writes inside the tag runs here, once per item, with _item and _itemStatus -->
    <ui:repeat value="#{cc.attrs.items}" var="_item" varStatus="_itemStatus">
      <div class="slide #{_itemStatus.index}"><cc:insertChildren/></div>
    </ui:repeat>
  </cc:implementation>
</ui:component>
