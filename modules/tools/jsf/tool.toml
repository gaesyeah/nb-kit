# JSF checks for nbkit: warnings in the xhtml editor (EL, ids, forms, templates...), with the same
# colors as the Java warnings. The texts inside NetBeans follow the system language (Bundle.properties
# and Bundle_pt.properties in the jar). The Java code is in src/nbkit-jsf.

[tool]
name = { en = "JSF checks", pt-BR = "Verificações de JSF" }
description = { en = "Warnings in the xhtml editor: EL, ids, forms, templates", pt-BR = "Avisos no editor de xhtml: EL, ids, formulários, templates" }
# raise it when the jar changes, so the menu offers the update
version = 2
# shown after the install
hint = { en = "the rules turn on and off in Tools > Options > Editor > JSF", pt-BR = "as regras ligam e desligam em Tools > Options > Editor > JSF" }

# the NetBeans module the tool installs: the jar in this folder, the module name inside it (OpenIDE-Module)
# and its sha256 (src/build.sh updates it)
[netbeans_module]
jar = "nbkit-jsf.jar"
codename = "nbkit.jsf"
sha256 = "fb8d793f11f46d76c440d3ffb6f7b74833119e82328a6b0a1c57a7e85a330894"

# lines shown before confirming the uninstall
[uninstall]
goes = { en = "the checks module (the warnings leave the xhtml editor)", pt-BR = "o módulo de verificações (os avisos somem do editor de xhtml)" }
stays = { en = "what you ticked in Tools > Options > Editor > JSF, for a next install", pt-BR = "o que você marcou em Tools > Options > Editor > JSF, para uma próxima instalação" }
