# One Dark Pro Mix: editor colors.
# Tables: [all] (every language), [highlights], [annotations], ["<mime>"] (one language) and
# ["<mime>".extra] (names that language does not declare, such as the nbkit-* categories of the coloring module).
# Each value: "#rrggbb [on #rrggbb] [bold|italic|bold italic|plain] [underline|wave|strike #rrggbb] [inherits <token>]"

# general tokens (all languages)
[all]
default                = "#abb2bf on #282c34"
comment                = "#7f848e"
keyword                = "#c678dd"
string                 = "#98c379"
char                   = "#98c379"
number                 = "#d19a66"
operator               = "#56b6c2"
separator              = "#abb2bf"
identifier             = "#e06c75"
field                  = "#e06c75"
method                 = "#61afef bold"
markup-element         = "#e06c75"
markup-attribute       = "#d19a66"
markup-attribute-value = "#98c379"
url                    = "#61afef underline #61afef"
whitespace             = "#40444b"
mark-occurrences       = "on #474d59"
error                  = "on #372e34 wave #c24038"
warning                = "on #393739 wave #d19a66"

# highlights: selection, current line, search...
[highlights]
caret-color-insert-mode                    = "#528bff"
caret-color-overwrite-mode                 = "#528bff"
selection                                  = "on #404859"
highlight-caret-row                        = "on #2c313c"
highlight-search                           = "on #45484f"
line-number                                = "#495162 on #282c34"
indent-guide-lines                         = "#3b4048"
text-limit-line-color                      = "#3c4049"
nbeditor-bracesMatching-match              = "on #515a6b"
nbeditor-bracesMatching-match-multichar    = "on #515a6b"
nbeditor-bracesMatching-mismatch           = ""
synchronized-text-blocks-ext               = "on #393e49"
synchronized-text-blocks-ext-slave         = "on #393e49"
nbeditor-bracesMatching-mismatch-multichar = ""
hyperlinks                                 = "#61afef underline #61afef"
block-search                               = "on #2f3339"
inc-search                                 = "on #554941"
code-folding                               = "#808080 on #3a3a3a"
code-folding-bar                           = "#c5c5c5"
code-folding-border                        = "#c5c5c5"
coverage-covered                           = "on #203d49"
coverage-uncovered                         = "on #53232a"

# annotations: error and warning underlines
[annotations]
org-netbeans-modules-cnd-cpp-parser_annotation_err            = "wave #c24038"
org-netbeans-modules-web-core-syntax-JspParserErrorAnnotation = "wave #c24038"
PHPError                                                      = "wave #c24038"
PHPNotice                                                     = "wave #d19a66"
PHPWarning                                                    = "wave #d19a66"
CurrentPC                                                     = "on #53562a"
CurrentPCLinePart                                             = "on #53562a"
CallSite                                                      = "on #415849"
CurrentExpression                                             = "on #53562a"
CurrentExpressionLine                                         = "on #53562a"
CurrentExpressionLine_BP                                      = "on #53562a"
CurrentExpressionLine_CBP                                     = "on #53562a"
CurrentExpressionLine_DBP                                     = "on #53562a"
CurrentExpressionLine_DCBP                                    = "on #53562a"
Dbx_PC                                                        = "on #53562a"
debugger-PC_BP                                                = "on #53562a"
debugger-PC_BP_broken                                         = "on #53562a"
debugger-PC_BP_stroke                                         = "on #53562a"
debugger-PC_CBP                                               = "on #53562a"
debugger-PC_CBP_broken                                        = "on #53562a"
debugger-PC_CBP_stroke                                        = "on #53562a"
debugger-PC_DBP                                               = "on #53562a"
debugger-PC_DBP_stroke                                        = "on #53562a"
debugger-PC_DCBP                                              = "on #53562a"
debugger-PC_DCBP_stroke                                       = "on #53562a"
debugger-PC_mixedBP                                           = "on #53562a"
debugger-PC_mixedBP_broken                                    = "on #53562a"
debugger-PC_multi_BPCBP                                       = "on #53562a"
debugger-PC_multi_BPCBP_broken                                = "on #53562a"
debugger-PC_multi_DBPCBP                                      = "on #53562a"

